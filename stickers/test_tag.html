<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@300;400;600&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body { background: #222; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
.tag-container { position: relative; width: 280px; height: 240px; overflow: visible; }
.tag-bg {
  position: absolute;
  top: 40px; left: 30px;
  width: 220px; height: 180px;
}
.mini-heart {
  position: absolute;
}
.tag-text {
  position: absolute;
  top: 40px; left: 30px;
  width: 220px; height: 180px;
  z-index: 2;
}
.tag-date-left {
  position: absolute;
  top: 42px; left: 25px;
  font-family: 'Lora', serif;
  font-size: 16px;
  font-weight: 300;
  color: #000;
  letter-spacing: -0.3px;
  transform: rotate(-25deg);
  transform-origin: left center;
}
.tag-date-right {
  position: absolute;
  top: 42px; right: 25px;
  font-family: 'Lora', serif;
  font-size: 15px;
  font-weight: 300;
  color: #000;
  letter-spacing: -0.3px;
  transform: rotate(25deg);
  transform-origin: right center;
}
.tag-venue {
  position: absolute;
  bottom: 12px; left: 0; right: 0;
  font-family: 'Lora', serif;
  font-size: 17px;
  font-weight: 300;
  color: #000;
  letter-spacing: -0.2px;
  line-height: 1.4;
  text-align: center;
}
</style>
</head>
<body>
<div class="tag-container">
  <svg class="tag-bg" viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg">
    <polygon points="110,0 220,50 220,180 0,180 0,50" fill="#7a8a45" />
  </svg>

  <!-- Heart inside tag - center, 8 vertices -->
  <svg class="mini-heart" style="width:55px;height:50px;top:95px;left:113px;transform:rotate(-5deg);z-index:1" viewBox="0 0 30 28">
    <polygon points="14,27 2,14 4,4 12,3 15,11 22,2 28,6 26,16" fill="#e45375"/>
  </svg>

  <!-- Heart A: tiny, top-left -->
  <svg class="mini-heart" style="width:9px;height:9px;top:25px;left:95px;transform:rotate(-35deg)" viewBox="0 0 30 32">
    <polygon points="13,30 1,15 3,4 13,8 19,2 28,7 24,18" fill="#e45375"/>
  </svg>
  <!-- Heart B: big, top-right 위로 올림 -->
  <svg class="mini-heart" style="width:68px;height:62px;top:-30px;right:35px;transform:rotate(-18deg)" viewBox="0 0 34 30">
    <polygon points="19,28 32,18 33,10 30,3 23,2 18,12 14,3 7,1 1,6 2,14 6,20" fill="#e45375"/>
  </svg>
  <!-- Heart C: small, mid-right 위로 올림 -->
  <svg class="mini-heart" style="width:21px;height:19px;top:45px;right:35px;transform:rotate(48deg)" viewBox="0 0 28 26">
    <polygon points="12,24 1,12 3,3 14,8 24,2 26,14" fill="#e45375"/>
  </svg>
  <!-- Heart D: medium, upper-left -->
  <svg class="mini-heart" style="width:35px;height:32px;top:-5px;left:35px;transform:rotate(42deg)" viewBox="0 0 26 24">
    <polygon points="11,22 1,13 2,5 7,1 12,7 17,1 24,4 23,14" fill="#e45375"/>
  </svg>

  <div class="tag-text">
    <span class="tag-date-left">2026.08.22.</span>
    <span class="tag-date-right">SAT. 2:00 PM</span>
    <div class="tag-venue">LE VIRE MOIRE<br>2F CLEETA HALL</div>
  </div>
</div>
</body>
</html>
