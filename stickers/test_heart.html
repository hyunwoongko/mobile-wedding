<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@300;400;600&family=Rouge+Script&display=swap" rel="stylesheet">
<style>
body { background: #222; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
.heart-container { position: relative; width: 300px; }
.heart-svg { display: block; width: 300px; }
.heart-info { position: absolute; top: 0; left: 0; right: 0; height: 260px; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; padding-top: 60px; }
.heart-info .names { font-family: 'Lora', serif; font-size: 14px; font-weight: 300; color: #000; letter-spacing: -0.3px; margin-bottom: 12px; }
.heart-info .sub { font-family: 'Lora', serif; font-size: 13px; font-weight: 300; color: #000; letter-spacing: -0.2px; line-height: 1.3; margin: 0; }
.invited-wrap { margin-top: -83px; position: relative; z-index: 3; width: 300px; text-align: center; }
/* Shared line styles */
.il1, .il2 { font-family: 'Rouge Script', cursive; font-size: 48px; line-height: 0.5; white-space: nowrap; letter-spacing: -2px; display: block; }
.il1 { margin-left: -50px; }
.il2 { margin-left: 75px; }
/* Stroke layer behind */
.stroke-layer { position: relative; z-index: 1; }
.stroke-layer .il1, .stroke-layer .il2 { color: transparent; -webkit-text-stroke: 16px #7a8a45; }
/* Fill layer on top, exact same position */
.fill-layer { position: absolute; top: 0; left: 0; right: 0; z-index: 2; }
.fill-layer .il1, .fill-layer .il2 { color: #222; -webkit-text-stroke: 0; }
</style>
</head>
<body>
<div class="heart-container">
  <svg class="heart-svg" viewBox="0 0 300 265" xmlns="http://www.w3.org/2000/svg">
    <polygon points="30,148 18,82 35,35 95,18 140,55 168,15 235,5 275,35 285,95 265,155 168,215 132,215" fill="#e5556f" />
  </svg>
  <div class="heart-info">
    <p class="names">Ko Hyunwoong &bull; Park Seeun</p>
    <p class="sub">2026.08.22. SAT. 2:00 PM</p>
    <p class="sub">LE VIRE MOIRE</p>
    <p class="sub">2F CLEETA HALL</p>
  </div>
</div>
<div class="invited-wrap">
  <div class="stroke-layer">
    <span class="il1">You are lnvlted</span>
    <span class="il2">to our weddlng</span>
  </div>
  <div class="fill-layer">
    <span class="il1">You are invited</span>
    <span class="il2">to our wedding</span>
  </div>
</div>
</body>
</html>
